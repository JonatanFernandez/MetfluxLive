<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetfluxLive · Cell types</title>
  <script>try { const d = document.documentElement; if (localStorage.getItem("metflux.theme") === "light") d.dataset.theme = "light"; const L = JSON.parse(localStorage.getItem("metflux.look") || "{}") || {}, s = d.dataset.theme === "light" ? L.surfaceLight : L.surfaceDark; if (s && s !== "default") d.dataset.palette = s; if (L.accent && L.accent !== "default") d.dataset.accent = L.accent; } catch { /* storage unavailable */ }</script>
  <link rel="stylesheet" href="css/palettes.css">
  <style>
    :root { --bg: #0b1020; --panel: #111830; --panel2: #162040; --line: #243055; --text: #e8eefc; --muted: #93a2c6; --accent: #4cc9f0; --hot: #ffbe3c; }
    :root[data-theme="light"] { --bg: #eceff5; --panel: #f7f8fb; --panel2: #e6ebf3; --line: #d0d7e4; --text: #283044; --muted: #67718a; --accent: #2b7ca3; --hot: #b26f0e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 Inter, "Segoe UI", system-ui, -apple-system, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { font-size: 17px; margin: 0 8px 0 0; } header h1 b { color: var(--accent); }
    a { color: var(--accent); }
    select, input { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; color: var(--text); font: inherit; }
    input { min-width: 260px; }
    .count { color: var(--muted); }
    main { padding: 14px 20px 40px; }
    p.note { color: var(--muted); max-width: 90ch; margin: 0 0 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { position: sticky; top: 53px; background: var(--panel); cursor: pointer; user-select: none; white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.sub { color: var(--muted); }
    .warn { color: var(--hot); }
    tr:hover td { background: var(--panel); }
    button.exp { background: none; border: 0; color: var(--accent); cursor: pointer; font-size: 13px; padding: 0 4px; }
    #cmpBox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 14px; background: var(--panel); }
    #cmpBox h2 { font-size: 15px; margin: 0 0 8px; }
    .cmp-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .cmp-row input { min-width: 240px; }
    .hbtn { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 5px 12px; cursor: pointer; font: inherit; }
    .warn { color: var(--hot); }
    tr.detail > td { background: var(--panel); padding: 6px 12px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Metflux<b>Live</b> · <span data-i18n="cat.title"></span></h1>
    <select id="model"></select>
    <select id="group"></select>
    <input id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="cat.filter">
    <span class="count" id="count"></span>
    <span style="flex:1"></span>
    <button id="tourBtn" class="hbtn" data-i18n="h.tour"></button>
    <a id="docs" data-i18n="cat.docs"></a>
    <a href="index.html" data-i18n="cat.back"></a>
  </header>
  <main>
    <p class="note" data-i18n-html="cat.note"></p>
    <section id="cmpBox">
      <h2 data-i18n="cmpc.title"></h2>
      <div class="cmp-row">
        <label>A <input id="cmpA" list="ctxList" autocomplete="off" spellcheck="false" data-i18n-ph="cmpc.pick"></label>
        <label>B <input id="cmpB" list="ctxList" autocomplete="off" spellcheck="false" data-i18n-ph="cmpc.pick"></label>
        <button id="cmpGo" class="hbtn" data-i18n="cmpc.go"></button>
        <a id="cmpSim" hidden data-i18n="cmpc.sim" data-i18n-title="cmpc.simTitle"></a>
      </div>
      <datalist id="ctxList"></datalist>
      <div id="cmpOut"></div>
    </section>
    <table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table>
  </main>
  <script type="module">
    import { t, initLang, applyDom, docsLang } from "./js/i18n.js";
    import { CONTEXT_GROUPS, offGenes, blockedReactions } from "./js/core/contexts.js";
    import { renderCtxTable, renderCtxCompare, CTT_CSS } from "./js/ui/ctxtable.js";
    import { startTour } from "./js/ui/tour.js";
    { const st = document.createElement("style"); st.textContent = CTT_CSS; document.head.appendChild(st); }
    const modelCache = new Map();
    const getModel = (slug) => { if (!modelCache.has(slug)) modelCache.set(slug, fetch(`data/${slug}/model.json`).then((r) => r.json())); return modelCache.get(slug); };
    initLang(); applyDom();
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    $("docs").href = `docs.html?lang=${docsLang()}#${docsLang()}-contexts`;
    const params = new URLSearchParams(location.search);
    const models = await (await fetch("data/models.json")).json();
    for (const m of models) $("model").add(new Option(`${m.name} ${m.version}`, m.slug));
    $("model").value = params.get("model") && models.some((m) => m.slug === params.get("model")) ? params.get("model") : models[0].slug;
    $("group").add(new Option(t("cat.all"), ""));
    for (const g of CONTEXT_GROUPS) $("group").add(new Option(t("ctx.group." + g), g));
    const COLS = [["open", ""], ["group", "cat.th.group"], ["name", "cat.th.name"], ["desc", "cat.th.desc"], ["src", "cat.th.src"], ["off", "cat.th.off", 1], ["blocked", "cat.th.blocked", 1], ["rescued", "cat.th.rescued", 1], ["pairs", "cat.th.pairs"], ["use", ""]];
    let rows = [], sortKey = "group", sortDir = 1;
    $("head").innerHTML = COLS.map(([k, l]) => `<th data-k="${k}">${l ? esc(t(l)) : ""}</th>`).join("");
    $("head").onclick = (ev) => { const k = ev.target.dataset.k; if (!k || k === "use" || k === "open") return; sortDir = sortKey === k ? -sortDir : 1; sortKey = k; render(); };
    async function load() {
      const slug = $("model").value;
      const d = await fetch(`data/${slug}/contexts.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null);
      try { const mine = JSON.parse(localStorage.getItem("metflux.userctx." + slug) || "[]"); if (d && Array.isArray(mine)) d.contexts.unshift(...mine); } catch { /* no storage */ }
      const order = new Map(CONTEXT_GROUPS.map((g, i) => [g, i]));
      rows = (d?.contexts || []).map((c) => {
        const i = c.info || {};
        const desc = c.id === "nci60" ? t("ctx.nci60Sub", { n: (i.lines || []).length }) : [i.disease || (c.group === "lineOther" ? i.category : ""), i.site, i.note].filter(Boolean).join(" · ");
        const off = c.off ? [...atob(c.off)].reduce((s, ch) => { let x = ch.charCodeAt(0), k = 0; while (x) { k += x & 1; x >>= 1; } return s + k; }, 0) : 0;
        return { c, group: order.get(c.group) ?? 9, name: c.name, desc, src: t("ctx.src." + c.src), off, blocked: c.nBlocked ?? 0, rescued: c.rescued.length,
          pairs: (c.pairs || []).map((p) => t("meas.name." + p)).join("; "), hay: norm([c.name, desc, i.category, i.cellosaurus, i.entity, t("ctx.group." + c.group)].join(" | ")), slug };
      });
      render(); fillList();
    }
    function render() {
      const q = norm($("q").value).trim().split(/\s+/).filter(Boolean), g = $("group").value;
      const vis = rows.filter((r) => (!g || r.c.group === g) && q.every((w) => r.hay.includes(w)));
      vis.sort((a, b) => sortDir * (typeof a[sortKey] === "number" ? a[sortKey] - b[sortKey] || a.name.localeCompare(b.name) : String(a[sortKey]).localeCompare(String(b[sortKey]))));
      $("count").textContent = t("cat.count", { n: vis.length, total: rows.length });
      $("rows").innerHTML = vis.map((r) => {
        const i = r.c.info || {};
        const link = i.cellosaurus ? ` <a href="https://www.cellosaurus.org/${encodeURIComponent(i.cellosaurus)}" target="_blank" rel="noopener">${esc(i.cellosaurus)}</a>` : i.entity ? ` <span class="sub">${esc(i.entity)}</span>` : "";
        return `<tr data-id="${esc(r.c.id)}"><td><button class="exp" title="${esc(t("cat.expand"))}">▸</button></td><td>${esc(t("ctx.group." + r.c.group))}</td><td><b>${esc(r.name)}</b>${link}${i.problematic ? `<div class="warn" title="${esc(i.problematic)}">⚠ ${esc(i.problematic.split(".")[0])}</div>` : ""}</td>
          <td class="sub">${esc(r.desc)}</td><td class="sub">${esc(r.src)}</td><td class="num">${r.off}</td><td class="num">${r.blocked}</td><td class="num">${r.rescued}</td>
          <td class="sub">${esc(r.pairs)}</td><td><a href="index.html?model=${encodeURIComponent(r.slug)}&context=${encodeURIComponent(r.c.id)}">${esc(t("cat.use"))}</a></td></tr>`;
      }).join("");
    }
    $("rows").onclick = async (ev) => {
      const b = ev.target.closest("button.exp");
      if (!b) return;
      const tr = b.closest("tr"), next = tr.nextElementSibling;
      if (next?.classList.contains("detail")) { next.remove(); b.textContent = "▸"; return; }
      b.textContent = "▾";
      const row = document.createElement("tr"); row.className = "detail";
      row.innerHTML = `<td colspan="${COLS.length}"><p class="note">${esc(t("ctt.loading"))}</p></td>`;
      tr.after(row);
      const r = rows.find((x) => x.c.id === tr.dataset.id), model = await getModel(r.slug);
      const off = offGenes(r.c, model.genes), blocked = blockedReactions(model, off);
      renderCtxTable(row.firstElementChild, model, off, blocked, { name: r.name });
    };
    // ---- comparator: two contexts of the same model
    const ctxByLabel = new Map();
    function fillList() {
      const dl = $("ctxList"); dl.textContent = ""; ctxByLabel.clear();
      for (const r of rows) { const label = `${r.name} — ${t("ctx.group." + r.c.group)}`; ctxByLabel.set(label, r); ctxByLabel.set(r.name, ctxByLabel.get(r.name) || r); const o = document.createElement("option"); o.value = label; dl.appendChild(o); }
    }
    async function compareNow() {
      const A = ctxByLabel.get($("cmpA").value.trim()), B = ctxByLabel.get($("cmpB").value.trim()), out = $("cmpOut");
      $("cmpSim").hidden = true;
      if (!A || !B) { out.innerHTML = `<p class="warn">${esc(t("cmpc.need"))}</p>`; return; }
      out.innerHTML = `<p class="note">${esc(t("ctt.loading"))}</p>`;
      const model = await getModel(A.slug);
      const side = (r) => { const off = offGenes(r.c, model.genes); return { name: r.name, off, blocked: blockedReactions(model, off) }; };
      renderCtxCompare(out, model, side(A), side(B));
      const sim = $("cmpSim");
      sim.href = `index.html?model=${encodeURIComponent(A.slug)}&context=${encodeURIComponent(A.c.id)}&vs=${encodeURIComponent(B.c.id)}`;
      sim.hidden = false;
    }
    $("cmpGo").onclick = compareNow;
    $("tourBtn").onclick = () => startTour(CAT_TOUR);
    $("model").onchange = load; $("group").onchange = render; $("q").oninput = render;
    if (params.get("group")) $("group").value = params.get("group");
    const CAT_TOUR = [{ id: "cat.welcome" }, { id: "cat.model", sel: "#model" }, { id: "cat.filter", sel: "#q" }, { id: "cat.table", sel: "table" }, { id: "cat.expand", sel: "#rows button.exp" }, { id: "cat.use", sel: "#rows td:last-child a" }, { id: "cat.compare", sel: "#cmpBox" }, { id: "cat.sim", sel: "#cmpGo" }, { id: "cat.end" }];
    await load();
    try { if (!localStorage.getItem("metflux.catTourSeen")) { localStorage.setItem("metflux.catTourSeen", "1"); startTour(CAT_TOUR); } } catch { /* no storage */ }
  </script>
</body>
</html>

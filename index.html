<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>MetfluxLive</title>
  <script>try { const d = document.documentElement; if (localStorage.getItem("metflux.theme") === "light") d.dataset.theme = "light"; const L = JSON.parse(localStorage.getItem("metflux.look") || "{}") || {}, s = d.dataset.theme === "light" ? L.surfaceLight : L.surfaceDark; if (s && s !== "default") d.dataset.palette = s; if (L.accent && L.accent !== "default") d.dataset.accent = L.accent; } catch { /* storage unavailable */ }</script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/palettes.css">
  <link rel="stylesheet" href="css/mobile.css">
</head>
<body>
  <header id="topbar">
    <div class="tb-side">
      <div class="brand"><svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><circle class="s" stroke-width="3" cx="30" cy="27" r="13"/><path class="s" stroke-width="3" d="M8.5 7.83L14.59 12.77"/><path class="s" stroke-width="3" d="M33.5 36.5L30 40L33.5 43.5"/><circle class="sf" cx="5" cy="5" r="3.5"/><circle class="h" cx="43" cy="27" r="4"/><circle class="s" stroke-width="2.5" cx="43" cy="27" r="4"/><circle class="f" cx="20.81" cy="17.81" r="6.5"/><circle class="s" stroke-width="3" cx="20.81" cy="17.81" r="6.5"/></svg><span class="brand-text">Metflux<b>Live</b></span></div>
      <select id="modelSelect" data-i18n-title="h.model"></select>
      <div class="search">
        <input id="search" type="search" data-i18n-ph="h.search" autocomplete="off" spellcheck="false">
        <div id="searchResults" class="dropdown" hidden></div>
      </div>
    </div>
    <div class="tb-center">
      <div class="segmented" id="modeToggle" role="tablist" data-i18n-aria="h.modeAria">
        <button data-mode="steady" class="on" data-i18n="h.steady"></button>
        <button data-mode="dynamic" data-i18n="h.dynamic"></button>
      </div>
      <button id="methodsBtn" class="icon" data-i18n-title="h.methodsTitle">?</button>
      <div class="runbox">
        <button id="runBtn" class="primary" data-i18n="h.run" data-i18n-title="h.runTitle"></button>
        <button id="autoBtn" role="switch" aria-checked="true" data-i18n-title="h.autoTitle"><i class="sw-track"><i></i></i><span data-i18n="h.auto"></span></button>
      </div>
    </div>
    <div class="tb-side right">
      <button id="tourBtn" data-i18n="h.tour" data-i18n-title="h.tourTitle"></button> <button id="demoBtn" class="link" data-i18n="demo.button" data-i18n-title="demo.buttonTitle"></button>
      <a id="docsBtn" class="btn" href="docs.html" target="_blank" rel="noopener" data-i18n="h.docs" data-i18n-title="h.docsTitle"></a>
      <button id="editBtn" class="toggle" data-i18n="h.edit" data-i18n-title="h.editTitle"></button>
      <button id="importBtn" data-i18n="h.import" data-i18n-title="h.importTitle"></button>
      <input id="importFile" type="file" accept=".json,.zip,application/json,application/zip" hidden>
      <button id="exportBtn" data-i18n="h.export" data-i18n-title="h.exportTitle"></button>
      <button id="themeBtn" class="icon theme" role="switch" aria-checked="true" data-i18n-title="h.themeTitle" data-i18n-aria="h.themeTitle">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
      </button>
      <button id="lookBtn" class="icon" data-i18n-title="look.title" data-i18n-aria="look.title"><svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5C21 6.6 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10" cy="7" r="1.2" fill="currentColor"/><circle cx="14.5" cy="7" r="1.2" fill="currentColor"/><circle cx="17" cy="11" r="1.2" fill="currentColor"/></svg></button>
      <select id="langSel" data-i18n-title="h.lang"></select>
    </div>
  </header>

  <main>
    <aside id="left" data-task="sim">
      <nav id="taskTabs" class="task-tabs" role="tablist" data-i18n-aria="tab.aria">
        <button type="button" role="tab" data-task="sim" class="on" aria-selected="true" data-i18n-title="tab.simTitle"><span data-i18n="tab.sim"></span></button>
        <button type="button" role="tab" data-task="cmp" aria-selected="false" data-i18n-title="tab.cmpTitle"><span data-i18n="tab.cmp"></span><span id="cmpTabBadge" class="tab-badge" hidden></span></button>
        <button type="button" role="tab" data-task="data" aria-selected="false" data-i18n-title="tab.dataTitle"><span data-i18n="tab.data"></span></button>
      </nav>
      <section id="secEdits" class="fold edits" hidden>
        <h2><span data-i18n="h.edits"></span> <button id="discardEdits" class="link" data-i18n="ed.discard" hidden></button></h2>
        <p class="hint" id="editSummary"></p>
        <div id="editTools">
          <p class="hint" data-i18n-html="ed.hint"></p>
          <div class="row ed-buttons">
            <button id="addRxnBtn" data-i18n="ed.addRxn"></button>
            <button id="addMetBtn" data-i18n="ed.addMet"></button>
          </div>
          <div class="add">
            <input id="removeSearch" type="search" data-i18n-ph="ed.removePh" autocomplete="off" spellcheck="false">
            <div id="removeResults" class="dropdown" hidden></div>
          </div>
        </div>
        <div id="editList"></div>
        <div id="editIssues"></div>
      </section>
      <section id="secContext" class="fold" data-task="sim" hidden>
        <h2><span data-i18n="h.context"></span> <button id="clearContext" class="link" data-i18n="ctx.clear" hidden></button> <a class="link" id="ctxBrowse" href="contexts.html" target="_blank" data-i18n="ctx.browse" data-i18n-title="ctx.browseTitle"></a> <a class="link" data-docs="contexts" target="_blank" data-i18n="obj.help"></a></h2>
        <div class="add">
          <input id="ctxInput" type="search" data-i18n-ph="ctx.ph" autocomplete="off" spellcheck="false">
          <div id="ctxResults" class="dropdown" hidden></div>
        </div>
        <div id="ctxCurrent"></div>
        <div class="row medium-bar">
          <select id="ctxMode" class="grow" data-i18n-title="ctx.modeTitle"><option value="block" data-i18n="ctx.mode.block"></option><option value="complex" data-i18n="ctx.mode.complex"></option><option value="penalty" data-i18n="ctx.mode.penalty"></option></select>
        </div>
        <p class="hint" id="ctxNote"></p>
      </section>
      <section id="secMedium" class="fold" data-task="sim">
        <h2><span data-i18n="h.medium"></span> <button id="resetMedium" class="link" data-i18n="h.reset" data-i18n-title="h.resetTitle"></button></h2>
        <div class="row medium-bar">
          <select id="mediumSel" class="grow" data-i18n-title="h.mediumSel"></select>
          <button id="saveMedium" class="link" data-i18n="medium.save" data-i18n-title="medium.saveTitle"></button>
          <button id="deleteMedium" class="link" data-i18n="medium.delete" hidden></button>
        </div>
        <p class="hint" id="mediumNote"></p>
        <p class="hint" data-i18n-html="h.mediumHint"></p>
        <div class="add">
          <input id="addSupply" type="search" data-i18n-ph="h.addSupply" autocomplete="off" spellcheck="false">
          <div id="addResults" class="dropdown" hidden></div>
        </div>
        <div class="row trl-row"><select id="trLib" class="grow" data-i18n-title="trl.title"></select></div>
        <div id="tracerList"></div>
        <div id="supplyList"></div>
      </section>
      <section id="secMeasured" class="fold" data-task="sim">
        <h2><span data-i18n="h.measured"></span> <button id="resetMeasured" class="link" data-i18n="h.reset" data-i18n-title="meas.resetTitle"></button></h2>
        <div class="row medium-bar">
          <select id="measuredSel" class="grow" data-i18n-title="h.measured"></select>
          <label class="tol" data-i18n-title="meas.tolTitle">± <input id="measTol" type="number" min="0" max="100" step="5"> %</label>
        </div>
        <p class="hint" id="measuredNote"></p>
        <div class="add">
          <input id="addMeasured" type="search" data-i18n-ph="h.addMeasured" autocomplete="off" spellcheck="false">
          <div id="measuredResults" class="dropdown" hidden></div>
        </div>
        <div id="measuredList"></div>
      </section>
      <section id="secObjective" class="fold" data-task="sim">
        <h2><span data-i18n="h.objective"></span> <a class="link" data-docs="objectives" target="_blank" data-i18n="obj.help"></a></h2>
        <div class="row medium-bar">
          <select id="objPreset" class="grow" data-i18n-title="obj.presetTitle"></select>
          <button id="saveObjective" class="link" data-i18n="medium.save" data-i18n-title="obj.saveTitle"></button>
          <button id="deleteObjective" class="link" data-i18n="medium.delete" hidden></button>
        </div>
        <p class="hint" id="objNote"></p>
        <div class="row">
          <select id="objSense"><option value="max" data-i18n="h.max"></option><option value="min" data-i18n="h.min"></option></select>
          <div class="add grow">
            <input id="objInput" type="search" data-i18n-ph="h.objInput" autocomplete="off" spellcheck="false">
            <div id="objResults" class="dropdown" hidden></div>
          </div>
        </div>
        <div id="objCurrent" class="chip"></div>
        <label class="check"><input id="pfba" type="checkbox" checked> <span data-i18n="h.pfba"></span></label>
        <details id="secBox" class="sec2"><summary data-i18n="sec.title"></summary>
          <div class="row"><select id="secPreset" class="grow" data-i18n-title="sec.pickTitle"></select></div>
          <div class="row sec-keep"><label for="secFrac" data-i18n="sec.keep"></label><input id="secFrac" type="range" min="0" max="100" step="5" value="90" class="grow"><b id="secFracVal">90 %</b></div>
          <p class="hint" data-i18n-html="sec.hint"></p>
          <button id="secCurveBtn" class="link" data-i18n="sec.curve" data-i18n-title="sec.curveTitle"></button>
          <div id="secCurve"></div>
        </details>
      </section>
      <section id="secPerturb" class="fold" data-task="sim">
        <h2><span data-i18n="h.perturb"></span> <button id="clearPerturb" class="link" data-i18n="h.clearPerturb" hidden></button></h2>
        <p class="hint" data-i18n="h.perturbHint"></p>
        <div class="add">
          <input id="addPerturb" type="search" data-i18n-ph="h.addPerturb" autocomplete="off" spellcheck="false">
          <div id="perturbResults" class="dropdown" hidden></div>
        </div>
        <div id="perturbList"></div>
        <details id="ctxExplore" hidden><summary></summary><div id="ctxExploreBox"></div></details>
        <details id="simScreens" class="sec2"><summary data-i18n="scr.groupTitle"></summary>
          <div class="row"><button id="geneScreen" class="link" data-i18n="scr.button" data-i18n-title="scr.title"></button> <a class="link" data-docs="screen" target="_blank" data-i18n="obj.help"></a></div>
          <div id="screenOut"></div>
          <div class="row"><button id="nutScreen" class="link" data-i18n="nut.button" data-i18n-title="nut.title"></button> <a class="link" data-docs="screen-nutrients" target="_blank" data-i18n="obj.help"></a></div>
          <div id="nutOut"></div>
        </details>
      </section>
      <section id="dynSection" class="fold" data-task="sim" hidden>
        <h2><span data-i18n="h.dynParams"></span></h2>
        <label class="field"><span class="t" data-i18n="h.dynHours"></span> <span><input id="dynHours" type="number" min="0.1" step="1" value="24"> h</span></label>
        <label class="field"><span class="t" data-i18n="h.dynBiomass"></span> <span><input id="dynBiomass" type="number" min="0.001" step="0.1" value="0.5"> gDW/L</span></label>
        <label class="field"><span class="t" data-i18n="h.dynPool"></span> <span><input id="dynPool" type="number" min="0.01" step="0.1" value="0.5"> µmol/gDW</span></label>
        <p class="hint" data-i18n="h.dynHint"></p>
      </section>
      <section id="secEvents" class="fold" data-task="sim" hidden>
        <h2><span data-i18n="h.events"></span> <button id="clearEvents" class="link" data-i18n="h.clearPerturb" hidden></button></h2>
        <p class="hint" data-i18n="h.eventsHint"></p>
        <div class="add">
          <input id="addEvent" type="search" data-i18n-ph="h.addEvent" autocomplete="off" spellcheck="false">
          <div id="eventResults" class="dropdown" hidden></div>
        </div>
        <button id="addMediumEvent" class="link" data-i18n="ev.addMedium"></button>
        <div id="eventList"></div>
      </section>
      <section id="secCompare" class="fold" data-task="cmp">
        <h2><span data-i18n="h.compare"></span> <button id="stopCompare" class="link" data-i18n="cmp.stop" hidden></button></h2>
        <p class="hint" data-i18n-html="cmp.hint"></p>
        <button id="saveScenario" data-i18n="cmp.save" data-i18n-title="cmp.saveTitle"></button>
        <div id="scenarioList"></div>
        <div id="cmpPick" class="cmp-pick" hidden>
          <label><span data-i18n="cmp.showLbl"></span> <select id="cmpShow" data-i18n-title="cmp.showTitle"></select></label>
          <button id="cmpSwap" class="icon" data-i18n-title="cmp.swapTitle">⇅</button>
          <label><span data-i18n="cmp.refLbl"></span> <select id="cmpRef" data-i18n-title="cmp.refTitle"></select></label>
        </div>
      </section>
      <section id="secDiffScreens" class="fold" data-task="cmp">
        <h2><span data-i18n="diff.title"></span> <a class="link" data-docs="screen-nutrients" target="_blank" data-i18n="obj.help"></a></h2>
        <p class="hint" data-i18n="diff.hint"></p>
        <div class="row diff-btns">
          <button id="cmpNutScreen" data-i18n="diff.nutBtn" data-i18n-title="diff.nutTitle"></button>
          <button id="cmpGeneScreen" data-i18n="diff.geneBtn" data-i18n-title="diff.geneTitle"></button>
        </div>
        <div id="cmpScreenOut"></div>
      </section>
      <section id="secDesign" class="fold" data-task="cmp">
        <h2><span data-i18n="des.secTitle"></span> <a class="link" data-docs="design" target="_blank" data-i18n="obj.help"></a></h2>
        <p class="hint" data-i18n="des.secHint"></p>
        <button id="designBtn" data-i18n="des.open" data-i18n-title="des.openTitle"></button>
      </section>
      <section id="secDataIntro" class="task-intro" data-task="data">
        <p class="hint" data-i18n="data.intro"></p>
      </section>
      <section id="secExo" class="fold" data-task="data">
        <h2><span data-i18n="data.exoTitle"></span> <a class="link" data-docs="exometabolomics" target="_blank" data-i18n="obj.help"></a></h2>
        <p class="hint" data-i18n="data.exoHint"></p>
        <button id="exoOpen" data-i18n="exo.open" data-i18n-title="exo.openTitle"></button>
      </section>
      <section id="secMtb" class="fold" data-task="data">
        <h2><span data-i18n="h.mtb"></span> <a class="link" data-docs="metabolomics" target="_blank" data-i18n="obj.help"></a></h2>
        <p class="hint" data-i18n="data.mtbHint"></p>
        <button id="mtbOpen" data-i18n="mtb.open" data-i18n-title="mtb.openTitle"></button>
        <p class="hint" id="mtbNote"></p>
        <div class="row" id="mtbOverlayWrap" hidden>
          <label class="check"><input id="mtbOverlay" type="checkbox"> <span data-i18n="mtb.showMap"></span></label>
          <button id="mtbClear" class="link" data-i18n="mtb.clear"></button>
        </div>
      </section>
      <section id="secRna" class="fold" data-task="data">
        <h2><span data-i18n="data.rnaTitle"></span> <a class="link" data-docs="contexts" target="_blank" data-i18n="obj.help"></a></h2>
        <p class="hint" data-i18n="data.rnaHint"></p>
        <div class="stack">
          <button id="rnaOpen" data-i18n="rna.open" data-i18n-title="rna.openTitle"></button>
          <button id="regOpen" data-i18n="reg.open" data-i18n-title="reg.openTitle"></button>
        </div>
        <p class="hint" id="regNote"></p>
        <div class="row" id="regBar" hidden>
          <label class="check grow"><input id="regShowMap" type="checkbox" checked> <span data-i18n="reg.showMap"></span></label>
          <button id="regClear" class="link" data-i18n="reg.clear"></button>
        </div>
        <p class="hint" id="regMarkTxt"></p>
      </section>
    </aside>
    <div class="resizer" id="resLeft" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="h.resize"></div>

    <section id="stage">
      <canvas id="map"></canvas>
      <div id="navBar"><button id="navBack" class="navbtn" disabled data-i18n-title="nav.back" data-i18n-aria="nav.back">‹</button><button id="navFwd" class="navbtn" disabled data-i18n-title="nav.fwd" data-i18n-aria="nav.fwd">›</button><nav id="crumbs"></nav></div>
      <div id="ctxMenu" class="ctxmenu" hidden role="menu"></div>
      <div id="cmpViews" class="cmp-views" role="radiogroup" data-i18n-aria="cmpv.group" hidden><button type="button" role="radio" data-v="a"></button><button type="button" role="radio" data-v="b"></button><button type="button" role="radio" data-v="ab"></button></div>
      <div id="badges"><span id="editBadge" class="badge-chip edit" hidden></span><span id="compareBadge" class="badge-chip cmp" hidden data-i18n-title="cmp.badgeTitle"></span></div>
      <div id="viewOpts">
        <select id="groupSel" data-i18n-title="h.groupTitle">
          <option value="cascade" data-i18n="group.cascade"></option>
          <option value="pathway" data-i18n="group.pathway"></option>
          <option value="cell" data-i18n="group.cell"></option>
        </select>
        <select id="filterSel" data-i18n-title="h.filterTitle">
          <option value="all" data-i18n="filter.all"></option>
          <option value="label" data-i18n="filter.label"></option>
          <option value="delta" data-i18n="filter.delta"></option>
          <option value="rev" data-i18n="filter.rev"></option>
          <option value="dlabel" data-i18n="filter.dlabel"></option>
        </select>
        <label class="check" data-i18n-title="h.inactiveTitle"><input id="optInactive" type="checkbox" checked> <span data-i18n="h.inactive"></span></label>
        <label class="check"><input id="optParticles" type="checkbox" checked> <span data-i18n="h.particles"></span></label>
        <label class="check" data-i18n-title="h.adaptiveTitle"><input id="optAdaptive" type="checkbox"> <span data-i18n="h.adaptive"></span></label>
        <button id="fitBtn" class="icon" data-i18n-title="h.fit">⤢</button>
      </div>
      <div id="legendBox">
        <label class="qty"><span data-i18n="qty.label"></span>
          <select id="qtySel">
            <optgroup data-i18n-label="qty.gAtoms"><option value="carbon" data-i18n="qty.carbon"></option><option value="nitrogen" data-i18n="qty.nitrogen"></option></optgroup>
            <optgroup data-i18n-label="qty.gRedox"><option value="redox" data-i18n="qty.redox"></option><option value="nadh" data-i18n="qty.nadh"></option><option value="nadph" data-i18n="qty.nadph"></option><option value="qh2" data-i18n="qty.qh2"></option></optgroup>
            <optgroup data-i18n-label="qty.gEnergy"><option value="atp" data-i18n="qty.atp"></option><option value="dg" data-i18n="qty.dg"></option></optgroup>
          </select>
          <a class="qhelp" data-docs="carbonflow" target="_blank" data-i18n-title="qty.help">?</a>
        </label>
        <div id="legend"></div>
      </div>
      <div id="timeline" hidden>
        <button id="playBtn" class="icon">▶</button>
        <input id="timeSlider" type="range" min="0" max="0" value="0">
        <span id="timeLabel"></span>
      </div>
      <div id="listView" hidden></div>
      <div id="emptyNote" data-i18n="empty.filter" hidden></div>
      <div id="tooltip" hidden></div>
      <div id="statusBox"><div id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100"><i></i></div><div id="status"></div></div>
    </section>

    <div class="resizer" id="resRight" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="h.resize"></div>
    <aside id="right"><div id="details"></div></aside>
  </main>

  <dialog id="molDialog">
    <form method="dialog">
      <header><h3 id="molTitle"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <p class="hint" id="molHint"></p>
      <div class="mol-tools">
        <button type="button" data-act="allC" data-i18n="h.molAllC"></button>
        <button type="button" data-act="allN" data-i18n="h.molAllN"></button>
        <button type="button" data-act="clear" data-i18n="h.molClear"></button>
        <span class="spacer"></span>
        <label><span data-i18n="h.molFraction"></span> <input id="molFraction" type="range" min="1" max="100" value="100"> <output id="molFractionOut">100 %</output></label>
      </div>
      <div id="molCanvas"></div>
      <footer><span id="molName"></span><span class="spacer"></span><button value="cancel" data-i18n="h.cancel"></button><button id="molApply" value="ok" class="primary" data-i18n="h.molApply"></button></footer>
    </form>
  </dialog>

  <dialog id="rxnDialog" class="editor">
    <form method="dialog">
      <header><h3 id="rxnTitle"></h3><a class="link" href="docs.html" data-docs="editing" target="_blank" rel="noopener" data-i18n="ed.requirements"></a><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <p class="hint" id="rxnHint"></p>
      <div class="ed-grid">
        <label><span data-i18n="ed.f.id"></span><input id="rxId" type="text" spellcheck="false"></label>
        <label><span data-i18n="ed.f.name"></span><input id="rxName" type="text"></label>
        <label><span data-i18n="ed.f.pathway"></span><input id="rxSub" type="text" list="subList" data-i18n-ph="ed.f.pathwayPh"><datalist id="subList"></datalist></label>
        <label><span>EC</span><input id="rxEc" type="text" spellcheck="false" placeholder="1.1.1.27"></label>
      </div>
      <div id="rxEqFixed" class="eq" hidden></div>
      <div id="rxEqBox" class="eqbox">
        <div>
          <h4 data-i18n="ed.substrates"></h4>
          <div id="rxSubs"></div>
          <div class="add"><input id="rxAddS" type="search" data-i18n-ph="ed.addMetPh" autocomplete="off" spellcheck="false"><div id="rxAddSRes" class="dropdown" hidden></div></div>
        </div>
        <div class="arrow"><button type="button" id="rxSwap" class="icon" data-i18n-title="ed.swap">⇄</button></div>
        <div>
          <h4 data-i18n="ed.products"></h4>
          <div id="rxProds"></div>
          <div class="add"><input id="rxAddP" type="search" data-i18n-ph="ed.addMetPh" autocomplete="off" spellcheck="false"><div id="rxAddPRes" class="dropdown" hidden></div></div>
        </div>
      </div>
      <p class="hint"><button type="button" id="rxNewMet" class="link" data-i18n="ed.newMetLink"></button></p>
      <div class="ed-grid">
        <label><span data-i18n="ed.f.lb"></span><input id="rxLb" type="number" step="any"></label>
        <label><span data-i18n="ed.f.ub"></span><input id="rxUb" type="number" step="any"></label>
        <div class="row" style="align-self:end"><button type="button" id="rxIrrev" class="link" data-i18n="ed.irrev"></button><button type="button" id="rxRev" class="link" data-i18n="ed.rev"></button></div>
        <label class="wide"><span data-i18n="ed.f.gpr"></span><input id="rxGpr" type="text" spellcheck="false" placeholder="LDHA or LDHB or (LDHA and LDHB)"></label>
      </div>
      <div id="rxMapBox">
        <h4 data-i18n="ed.atomMap"></h4>
        <div class="row radios">
          <label class="check"><input type="radio" name="rxMap" value="auto"> <span data-i18n="ed.map.auto"></span></label>
          <label class="check"><input type="radio" name="rxMap" value="smiles"> <span data-i18n="ed.map.smiles"></span></label>
          <label class="check"><input type="radio" name="rxMap" value="none"> <span data-i18n="ed.map.noneOpt"></span></label>
        </div>
        <p class="hint" data-i18n-html="ed.map.hint"></p>
        <div class="row"><button type="button" id="rxAutoBtn" data-i18n="ed.map.compute"></button><span id="rxMapStatus" class="hint grow"></span></div>
        <div id="rxSmilesBox" hidden>
          <textarea id="rxSmiles" rows="3" spellcheck="false" placeholder="[CH3:1][C:2](=[O:3])[C:4](=[O:5])[OH:6]>>[CH3:1][CH:2]([OH:3])[C:4](=[O:5])[OH:6]"></textarea>
          <button type="button" id="rxSmilesRead" data-i18n="ed.map.read"></button>
        </div>
      </div>
      <label class="check" id="rxUnbalWrap" hidden><input type="checkbox" id="rxUnbal"> <span data-i18n="ed.unbalancedOk"></span></label>
      <div id="rxIssues" class="issues"></div>
      <footer><span class="spacer"></span><button value="cancel" data-i18n="h.cancel"></button><button id="rxSave" value="ok" class="primary" data-i18n="ed.save"></button></footer>
    </form>
  </dialog>

  <dialog id="metDialog" class="editor">
    <form method="dialog">
      <header><h3 id="metTitle"></h3><a class="link" href="docs.html" data-docs="editing" target="_blank" rel="noopener" data-i18n="ed.requirements"></a><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <div class="row radios">
        <label class="check"><input type="radio" name="mtKind" value="new"> <span data-i18n="ed.kindNew"></span></label>
        <label class="check"><input type="radio" name="mtKind" value="comp"> <span data-i18n="ed.kindComp"></span></label>
      </div>
      <div class="ed-grid">
        <label><span data-i18n="ed.f.comp"></span><select id="mtComp"></select></label>
        <label><span data-i18n="ed.f.metId"></span><code id="mtId"></code></label>
      </div>
      <div id="mtCompBox">
        <div class="add"><input id="mtBaseSearch" type="search" data-i18n-ph="ed.pickBasePh" autocomplete="off" spellcheck="false"><div id="mtBaseRes" class="dropdown" hidden></div></div>
        <div id="mtBase" class="chip"></div>
      </div>
      <div id="mtNewBox">
        <div class="ed-grid">
          <label class="wide"><span data-i18n="ed.f.name"></span><input id="mtName" type="text"></label>
          <label><span data-i18n="ed.f.formula"></span><input id="mtFormula" type="text" spellcheck="false" placeholder="C6H12O6"></label>
          <label><span data-i18n="ed.f.charge"></span><input id="mtCharge" type="number" step="1"></label>
        </div>
        <label class="block"><span data-i18n="ed.f.smiles"></span><textarea id="mtSmiles" rows="2" spellcheck="false" placeholder="CC(O)C(C)=O"></textarea></label>
        <div class="row"><button type="button" id="mtSmilesRead" data-i18n="ed.readSmiles"></button><span id="mtSmilesInfo" class="hint grow"></span></div>
        <p class="hint" data-i18n-html="ed.smilesHint"></p>
        <div id="mtPreview" class="molbox"></div>
      </div>
      <div id="mtIssues" class="issues"></div>
      <footer><span class="spacer"></span><button value="cancel" data-i18n="h.cancel"></button><button id="mtSave" value="ok" class="primary" data-i18n="ed.save"></button></footer>
    </form>
  </dialog>

  <dialog id="exportDialog">
    <form method="dialog">
      <header><h3 data-i18n="exp.title"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <p class="hint" data-i18n="exp.hint"></p>
      <div class="row"><button type="button" id="expAll" class="link" data-i18n="exp.all"></button><button type="button" id="expNone" class="link" data-i18n="exp.none"></button></div>
      <div id="expList"></div>
      <footer><span id="expStatus" class="hint"></span><span class="spacer"></span><button value="cancel" data-i18n="h.cancel"></button><button type="button" id="expGo" class="primary" data-i18n="exp.download"></button></footer>
    </form>
  </dialog>

  <dialog id="rnaDialog" class="editor">
    <form method="dialog" id="rnaForm">
      <header><h3 data-i18n="rna.title"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <details class="rna-how"><summary data-i18n="rna.howH"></summary><div data-i18n-html="rna.how"></div></details>
      <label class="rna-file"><span data-i18n="rna.file"></span> <input id="rnaFile" type="file" accept=".tsv,.tab,.txt,.csv,text/plain,text/csv,text/tab-separated-values"></label>
      <div id="rnaParsed" hidden>
        <div class="rna-grid">
          <label><span data-i18n="rna.idCol"></span><select id="rnaIdCol"></select></label>
          <label><span data-i18n="rna.valCol"></span><select id="rnaValCol"></select></label>
          <label><span data-i18n="rna.thr"></span><input id="rnaThr" type="number" min="0" step="any" value="1"></label>
          <label><span data-i18n="rna.name"></span><input id="rnaName" type="text" maxlength="60"></label>
        </div>
        <label class="rna-log"><input id="rnaLog" type="checkbox"> <span data-i18n="rna.log"></span></label>
        <p class="hint" id="rnaInfo"></p>
      </div>
      <p class="hint" id="rnaStatus"></p>
      <footer><span style="flex:1"></span><button type="button" id="rnaBuild" class="primary" data-i18n="rna.build" disabled></button></footer>
    </form>
  </dialog>
  <dialog id="exoDialog" class="editor">
    <form method="dialog" id="exoForm">
      <header><h3 data-i18n="exo.title"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <details class="rna-how"><summary data-i18n="exo.howH"></summary><div data-i18n-html="exo.how"></div></details>
      <label class="rna-file"><span data-i18n="exo.file"></span> <input id="exoFile" type="file" accept=".tsv,.tab,.txt,.csv,text/plain,text/csv,text/tab-separated-values"></label>
      <textarea id="exoText" rows="6" spellcheck="false" data-i18n-ph="exo.paste"></textarea>
      <div class="exo-grid">
        <label><span data-i18n="exo.gdwPerCell"></span><input id="exoGdw" type="number" min="0" step="any" value="300"></label>
        <label><span data-i18n="exo.condition"></span><select id="exoCond"></select></label>
      </div>
      <div class="row"><button type="button" id="exoParse" class="primary" data-i18n="exo.parse"></button></div>
      <p class="hint" id="exoStatus"></p>
      <div id="exoOut" hidden>
        <div id="exoRates"></div>
        <details id="exoUnmappedBox" hidden><summary id="exoUnmappedH"></summary><div id="exoUnmapped"></div></details>
        <div class="exo-grid">
          <label><span data-i18n="exo.mu"></span><input id="exoMu" type="number" min="0" step="any"></label>
          <label><span data-i18n="exo.muSd"></span><input id="exoMuSd" type="number" min="0" step="any"></label>
        </div>
        <div class="row">
          <button type="button" id="exoApply" data-i18n="exo.apply" data-i18n-title="exo.applyTitle"></button>
          <button type="button" id="exoCheck" data-i18n="exo.check" data-i18n-title="exo.checkTitle"></button>
        </div>
        <div id="exoFit"></div>
      </div>
    </form>
  </dialog>
  <dialog id="demoDialog" class="editor">
    <form method="dialog">
      <header><h3 data-i18n="demo.title"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <p class="hint" data-i18n="demo.intro"></p>
      <div id="demoList"></div>
    </form>
  </dialog>
  <dialog id="mtbDialog" class="editor">
    <form method="dialog" id="mtbForm">
      <header><h3 data-i18n="mtb.title"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <details class="rna-how"><summary data-i18n="mtb.howH"></summary><div data-i18n-html="mtb.how"></div></details>
      <label class="rna-file"><span data-i18n="mtb.file"></span> <input id="mtbFile" type="file" accept=".tsv,.tab,.txt,.csv,text/plain,text/csv,text/tab-separated-values"></label>
      <textarea id="mtbText" rows="6" spellcheck="false" data-i18n-ph="mtb.paste"></textarea>
      <div class="exo-grid">
        <label><span data-i18n="mtb.patA"></span><input id="mtbPatA" type="text" maxlength="40"></label>
        <label><span data-i18n="mtb.patB"></span><input id="mtbPatB" type="text" maxlength="40"></label>
      </div>
      <div class="row"><button type="button" id="mtbRun" class="primary" data-i18n="mtb.run"></button></div>
      <p class="hint" id="mtbStatus"></p>
      <div id="mtbOut" hidden></div>
      <details id="mtbUnmappedBox" hidden><summary id="mtbUnmappedH"></summary><div id="mtbUnmapped"></div></details>
    </form>
  </dialog>
  <dialog id="regDialog" class="editor">
    <form method="dialog" id="regForm">
      <header><h3 data-i18n="reg.title"></h3><a class="link" data-docs="regulators" target="_blank" data-i18n="obj.help"></a><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <details class="rna-how"><summary data-i18n="reg.howH"></summary><div data-i18n-html="reg.how"></div></details>
      <label class="rna-file"><span data-i18n="reg.file"></span> <input id="regFile" type="file" accept=".tsv,.tab,.txt,.csv,text/plain,text/csv,text/tab-separated-values"></label>
      <textarea id="regText" rows="6" spellcheck="false" data-i18n-ph="reg.paste"></textarea>
      <div class="row"><div class="row" id="regFluxRow">
            <label for="regFluxMethod" data-i18n="reg.fluxMethod"></label>
            <select id="regFluxMethod"></select>
            <select id="regCondA" hidden></select>
            <select id="regCondB" hidden></select>
          </div>
          <p class="hint" id="regFluxWhy"></p>
          <button type="button" id="regRun" class="primary" data-i18n="reg.run"></button><span id="regMeta" class="hint grow"></span></div>
      <p class="hint" id="regStatus"></p>
      <div id="regOut" hidden></div>
    </form>
  </dialog>
  <dialog id="methodsDialog">
    <form method="dialog">
      <header><h3 data-i18n="h.methods"></h3><button class="icon" value="cancel" data-i18n-aria="h.close">✕</button></header>
      <div class="methods">
        <article data-i18n-html="methods.steady"></article>
        <article data-i18n-html="methods.dynamic"></article>
      </div>
      <h4 data-i18n="methods.tracerH"></h4>
      <p data-i18n="methods.tracer"></p>
      <h4 data-i18n="methods.contextH"></h4>
      <p data-i18n-html="methods.context"></p>
      <h4 data-i18n="methods.perturbH"></h4>
      <p data-i18n-html="methods.perturb"></p>
      <footer><span class="spacer"></span><button value="ok" class="primary" data-i18n="h.ok"></button></footer>
    </form>
  </dialog>

  <div id="loading"><div class="box"><div class="spinner"></div><div id="loadingText">Loading model…</div></div></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
